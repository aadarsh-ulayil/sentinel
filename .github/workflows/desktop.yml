name: Desktop compatibility
on: [workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi uvicorn jinja2 httpx openai python-dotenv pytest PySide6-Essentials pyinstaller
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-${{ matrix.os }}
          path: dist/
