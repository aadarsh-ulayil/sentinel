[project]
name = "sentinel-gateway"
version = "0.1.0"
description = "A deterministic local safety gateway for AI tools"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "httpx>=0.27", "openai>=1.50", "python-dotenv>=1.0"]
[dependency-groups]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
